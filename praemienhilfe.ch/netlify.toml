[build]
  command = "npm run build"
  publish = "dist"

# Local plugin. onSuccess pings IndexNow only when CONTEXT=production.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/basel-stadt"
  to = "/de/basel-stadt/"
  status = 301

[[redirects]]
  from = "/basel-landschaft"
  to = "/de/basel-landschaft/"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/de/faq/"
  status = 301

[[redirects]]
  from = "/kontakt"
  to = "/de/kontakt/"
  status = 301

[[redirects]]
  from = "/so-funktioniert-es"
  to = "/de/so-funktioniert-es/"
  status = 301

[[redirects]]
  from = "/antrag"
  to = "/de/antrag/"
  status = 301

[[redirects]]
  from = "/impressum"
  to = "/de/impressum/"
  status = 301

[[redirects]]
  from = "/datenschutz"
  to = "/de/datenschutz/"
  status = 301

[[redirects]]
  from = "/danke"
  to = "/danke"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# The catch-all "/:canton" -> "/de/:canton" below treats any other single
# path segment as a canton. Without these rules, /robots.txt, /llms.txt,
# /llms-full.txt and the IndexNow key file are 301'd under /de/ and 404.
# A 200 to the same path, same as /sitemap.xml, serves the file.
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/dcf111e00c75171c97c5ab459cb08f8d.txt"
  to = "/dcf111e00c75171c97c5ab459cb08f8d.txt"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/llms-full.txt"
  status = 200

[[redirects]]
  from = "/de"
  to = "/de"
  status = 200

[[redirects]]
  from = "/en"
  to = "/en"
  status = 200

[[redirects]]
  from = "/es"
  to = "/es"
  status = 200

[[redirects]]
  from = "/:canton"
  to = "/de/:canton/"
  status = 301

[[redirects]]
  from = "https://xn--prmienhilfe-m8a.ch/*"
  to = "https://praemien-hilfe.ch/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://xn--prmienhilfe-m8a.ch/*"
  to = "https://praemien-hilfe.ch/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://praemienhilfe.ch/*"
  to = "https://praemien-hilfe.ch/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://praemienhilfe.ch/*"
  to = "https://praemien-hilfe.ch/:splat"
  status = 301
  force = true

